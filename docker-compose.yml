x-app: &app
  build:
    context: .
  image: distributed-wagering-processor:local
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production
    PORT: "3000"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    LOCALSTACK_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    container_name: distributed-wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack
    container_name: distributed-wagering-localstack
    restart: unless-stopped
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Configure LOCALSTACK_AUTH_TOKEN in .env}
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:4566/_localstack/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app1:
    <<: *app
    ports:
      - "3001:3000"

  app2:
    <<: *app
    ports:
      - "3002:3000"

  app3:
    <<: *app
    ports:
      - "3003:3000"


volumes:
  postgres-data:
